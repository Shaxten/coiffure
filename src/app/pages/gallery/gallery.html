<app-hero title="Notre Galerie" subtitle="Découvrez nos réalisations et laissez-vous inspirer." [compact]="true"></app-hero>

<section class="gallery-page">
  <div class="container">
    <div class="gallery-grid stagger-children">
      @for (item of galleryItems; track item.label) {
        <div class="gallery-item stagger-item">
          <div class="item-inner" [style.background]="item.color">
            <span class="item-emoji">{{ item.emoji }}</span>
            <div class="item-overlay">
              <span class="item-label">{{ item.label }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
