<app-hero title="Contact" subtitle="Nous sommes à votre écoute. N'hésitez pas à nous joindre." [compact]="true"></app-hero>

<section class="contact-page">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-info reveal-left">
        <h2>Nous Trouver</h2>
        <div class="info-list">
          <div class="info-item">
            <div class="info-icon">📍</div>
            <div><h4>Adresse</h4><p>456 Rue Saint-Denis<br>Montréal, QC H2J 2L1</p></div>
          </div>
          <div class="info-item">
            <div class="info-icon">📞</div>
            <div><h4>Téléphone</h4><p>(514) 555-HAIR</p></div>
          </div>
          <div class="info-item">
            <div class="info-icon">✉️</div>
            <div><h4>Courriel</h4><p>info&#64;elegance-salon.ca</p></div>
          </div>
          <div class="info-item">
            <div class="info-icon">🕐</div>
            <div><h4>Horaires</h4><p>Mar–Ven : 9h–19h<br>Sam : 9h–17h</p></div>
          </div>
        </div>
      </div>

      <div class="contact-form-wrapper reveal-right">
        <div class="contact-form">
          <h3>Envoyez-nous un message</h3>
          @if (submitted) {
            <div class="success">✓ Message envoyé avec succès !</div>
          }
          <form (ngSubmit)="onSubmit()">
            <div class="form-row">
              <div class="form-group">
                <label for="name">Nom</label>
                <input id="name" name="name" [(ngModel)]="formData.name" required placeholder="Votre nom">
              </div>
              <div class="form-group">
                <label for="phone">Téléphone</label>
                <input id="phone" name="phone" [(ngModel)]="formData.phone" placeholder="(514) 000-0000">
              </div>
            </div>
            <div class="form-group">
              <label for="email">Courriel</label>
              <input id="email" name="email" type="email" [(ngModel)]="formData.email" required placeholder="votre&#64;courriel.com">
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" [(ngModel)]="formData.message" required placeholder="Votre message..." rows="5"></textarea>
            </div>
            <button type="submit" class="submit-btn">Envoyer</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
